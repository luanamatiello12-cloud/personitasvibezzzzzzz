<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ateliê de Personagens VBZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: cast list | pixel stage | simple wardrobe. Stacks on phones. */
:root{
  --bg:#F5F5F7; --panel:#FFFFFF; --ink:#0B0B0D; --muted:#64607A; --line:#D9D9E3;
  --pink:#FF2EC4; --purple:#7A00FF; --stage:#3A1640; --stage2:#6B2A6E; --floor:#2A0F2E;
  --chip:#F0EEF6; --chip-on:#0B0B0D; --chip-on-ink:#FFFFFF; --danger:#C81E4B; --ok:#14865B;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --text:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --panel:#16151C; --ink:#F5F3FA; --muted:#A19DB5; --line:#2C2A38;
  --chip:#22202C; --chip-on:#F5F3FA; --chip-on-ink:#0B0B0D; --danger:#FF5C86; --ok:#3DDC97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --panel:#16151C; --ink:#F5F3FA; --muted:#A19DB5; --line:#2C2A38;
  --chip:#22202C; --chip-on:#F5F3FA; --chip-on-ink:#0B0B0D; --danger:#FF5C86; --ok:#3DDC97; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1280px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.logo{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;letter-spacing:-.02em;position:relative;line-height:1}
.logo svg{position:absolute;right:-12px;top:-8px;width:13px;height:13px;fill:var(--pink)}
h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--chip);color:var(--muted)}
.status.ok{color:var(--ok)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

.grid{display:grid;grid-template-columns:230px minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}
.cast{padding:12px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:12px}
.cast h2{font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 6px 6px}
.cgroup{display:flex;flex-direction:column;gap:4px}
.card{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;width:100%}
.card:hover{background:var(--chip)}
.card.on{border-color:var(--ink);background:var(--chip)}
.thumb{display:block;width:44px;height:44px;flex:none;border-radius:10px;overflow:hidden;background:var(--stage)}
.thumb canvas{width:44px;height:44px;display:block;image-rendering:pixelated}
.card div{min-width:0}
.card .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .rl{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:10px 8px}
.stage{position:sticky;top:12px;overflow:hidden;display:flex;flex-direction:column}
.floor{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:22px 0 18px;background:linear-gradient(180deg,var(--stage) 0%,var(--stage2) 100%)}
.floor::after{content:"";position:absolute;left:50%;bottom:14px;width:120px;height:14px;transform:translateX(-50%);background:var(--floor);border-radius:50%;opacity:.8}
.floor{min-height:240px}
.floor canvas{position:relative;z-index:1;height:var(--zh,198px);max-width:100%;width:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.pxctl{padding:12px 14px 4px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.pxctl label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.btn.turn{margin:6px 0 8px;font-size:13px;cursor:pointer}
.pxrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pxrow input{flex:1;accent-color:var(--pink);min-width:0}
.plate{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.plate .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.handle{font-family:var(--display);font-weight:800;font-size:22px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;background:var(--purple);color:#fff}
.tag.avatar{background:var(--pink)}
.bubble{font-size:13px;color:var(--muted)}
.bubble q{color:var(--ink)}
.form{padding:14px 16px 18px;display:flex;flex-direction:column;gap:2px}
.sec{border-top:1px solid var(--line);padding:12px 0 4px}
.sec:first-child{border-top:0;padding-top:2px}
.sec h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 6px}
.field{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hint{font-size:12px;color:var(--muted)}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:58px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:99px;padding:6px 12px;font-size:13px}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink)}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:28px;height:28px;border-radius:6px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border-radius:10px;background:var(--chip)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.exportbox{width:100%;min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
@media (max-width:1000px){.grid{grid-template-columns:200px minmax(0,1fr)}.form{grid-column:1 / -1}.cast,.stage{position:static}.cast{max-height:520px}}
@media (max-width:640px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .cast{flex-direction:row;overflow-x:auto;max-height:none}
  .cast h2{display:none}
  .cgroup{flex-direction:row}
  .card{width:auto;flex-direction:column;gap:4px;min-width:76px}
  .card .rl{display:none}
  .card .nm{max-width:72px;font-size:12px}
  .two{grid-template-columns:1fr}
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">VBZ<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0C11 7 13 9 20 10 13 11 11 13 10 20 9 13 7 11 0 10 7 9 9 7 10 0Z"/></svg></div>
      <div>
        <h1>Ateliê de personagens</h1>
        <div class="sub">Base em pixel art para NPCs e avatares</div>
      </div>
    </div>
    <div class="hbtns">
      <span class="status" id="status">Conectando…</span>
      <button class="btn" id="btnImport" type="button">Importar</button>
      <button class="btn" id="btnExport" type="button">Copiar lista</button>
      <button class="btn pink" id="btnNew" type="button">+ Novo personagem</button>
    </div>
  </header>

  <div class="grid">
    <aside class="pane cast" id="cast" aria-label="Elenco"><div class="empty">Carregando o elenco…</div></aside>
    <section class="pane stage" aria-label="Prévia">
      <div class="floor" id="preview"></div>
      <div class="pxctl">
        <label for="pxRange">Pixelado</label>
        <div class="pxrow"><span>mais</span><input type="range" id="pxRange" min="1" max="4" step="1" value="2"><span>menos</span></div>
        <div class="hint" id="pxName">Padrão</div>
        <label for="zmRange">Tamanho na tela</label>
        <div class="pxrow"><span>menor</span><input type="range" id="zmRange" min="1" max="6" step="1" value="3"><span>maior</span></div>
        <div class="hint" id="zmName">3×</div>
        <button class="btn turn" id="btnTurn" type="button" aria-pressed="false">↻ Virar · vendo de frente</button>
      </div>
      <div class="plate">
        <div class="h"><span class="handle" id="pHandle">—</span><span class="tag" id="pTag">NPC</span></div>
        <div class="bubble" id="pRole"></div>
        <div class="bubble" id="pLine"></div>
      </div>
    </section>
    <section class="pane form" id="form" aria-label="Editar personagem"></section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- options ---------- */
const SKIN=[{id:"clara",n:"Clara",c:"F2C9A0"},{id:"media",n:"Média",c:"D69A63"},{id:"morena",n:"Morena",c:"B07446"},{id:"escura",n:"Escura",c:"74462B"}];
const HAIR=[{id:"curto",n:"Curto"},{id:"comprido",n:"Comprido"},{id:"cacheado",n:"Cacheado"},{id:"blackpower",n:"Black power"},{id:"coque",n:"Coque"},{id:"raspado",n:"Raspado"},{id:"careca",n:"Careca"}];
const HAT=[{id:"nenhum",n:"Nenhum"},{id:"bone",n:"Boné"},{id:"gorro",n:"Gorro"}];
const GLASSES=[{id:"nenhum",n:"Nenhum"},{id:"escuros",n:"Óculos escuros"},{id:"grau",n:"Óculos de grau"}];
const TOPS=[{id:"camiseta",n:"Camiseta"},{id:"regata",n:"Regata"},{id:"babytee",n:"Baby tee"},{id:"moletom",n:"Moletom"},{id:"jaqueta",n:"Jaqueta"}];
const BOTTOMS=[{id:"calca",n:"Calça"},{id:"shorts",n:"Shorts"},{id:"saia",n:"Saia"}];
const SHOES=[{id:"tenis",n:"Tênis"},{id:"bota",n:"Bota"}];
const HAIRC=[{id:"2A1E1A",n:"Preto"},{id:"6B4026",n:"Castanho"},{id:"9A5B2E",n:"Castanho claro"},{id:"D9B060",n:"Loiro"},{id:"B5562B",n:"Ruivo"},{id:"9A98A0",n:"Grisalho"},{id:"E070B0",n:"Rosa"},{id:"7A3FB0",n:"Roxo"},{id:"3C5BB0",n:"Azul"},{id:"E8E2D8",n:"Platinado"}];
const CLOTH=[{id:"D9852B",n:"Laranja"},{id:"2F3352",n:"Marinho"},{id:"2A2630",n:"Preto"},{id:"EDE8E0",n:"Branco"},{id:"7D7A86",n:"Cinza"},{id:"B8323A",n:"Vermelho"},{id:"FF2EC4",n:"Vibe Pink"},{id:"7A00FF",n:"Vibe Purple"},{id:"3D6FB8",n:"Azul"},{id:"3E7A4A",n:"Verde"},{id:"E8C140",n:"Amarelo"},{id:"C9B08A",n:"Bege"},{id:"5A3A2A",n:"Marrom"},{id:"A3287B",n:"Magenta"}];
const PLACES=[{id:"atual",n:"Onde está hoje"},{id:"entrada",n:"Entrada"},{id:"praca",n:"Praça central"},{id:"pista",n:"Pista de dança"},{id:"palco",n:"Palco · DJ"},{id:"lounge",n:"Lounge"},{id:"shop",n:"VBZ Shop"},{id:"eventos",n:"Painel de eventos"},{id:"photo",n:"Photo spot"},{id:"mirante",n:"Mirante"}];
const DOES=[{id:"parado",n:"Parado"},{id:"conversando",n:"Conversando"},{id:"dancando",n:"Dançando"},{id:"sentado",n:"Sentado"},{id:"dj",n:"Tocando (DJ)"},{id:"andando",n:"Andando"}];
const ACTIONS=[{id:"nenhuma",n:"Só cumprimenta"},{id:"loja",n:"Abre a loja"},{id:"foto",n:"Tira foto"},{id:"jukebox",n:"Abre a jukebox"},{id:"evento",n:"Mostra eventos"}];

const byId=(list,id,fb)=>list.find(x=>x.id===id)||list.find(x=>x.id===fb)||list[0];
const HEXOK=s=>/^[0-9A-F]{6}$/i.test(s||"");
function defaults(){return{nome:"novo.vbz",tipo:"npc",papel:"",corpo:"m",pele:"media",cabelo:"curto",corCabelo:"6B4026",chapeu:"bone",corChapeu:"3A3440",oculos:"escuros",top:"camiseta",corTop:"D9852B",baixo:"calca",corBaixo:"2F3352",tenis:"tenis",corTenis:"5A3A2A",local:"praca",faz:"parado",acao:"nenhuma",fala:"",notas:"",ordem:Date.now()}}
function clean(r){const d=defaults(),o={...d,...(r&&typeof r==="object"?r:{})};
 o.nome=String(o.nome||"").slice(0,24);o.tipo=o.tipo==="avatar"?"avatar":"npc";o.corpo=o.corpo==="f"?"f":"m";
 o.pele=byId(SKIN,o.pele,"media").id;o.cabelo=byId(HAIR,o.cabelo,"curto").id;o.chapeu=byId(HAT,o.chapeu,"nenhum").id;o.oculos=byId(GLASSES,o.oculos,"nenhum").id;
 o.top=byId(TOPS,o.top,"camiseta").id;o.baixo=byId(BOTTOMS,o.baixo,"calca").id;o.tenis=byId(SHOES,o.tenis,"tenis").id;
 for(const k of["corCabelo","corChapeu","corTop","corBaixo","corTenis"])o[k]=HEXOK(o[k])?String(o[k]).toUpperCase():d[k];
 o.local=byId(PLACES,o.local,"praca").id;o.faz=byId(DOES,o.faz,"parado").id;o.acao=byId(ACTIONS,o.acao,"nenhuma").id;
 o.papel=String(o.papel||"").slice(0,40);o.fala=String(o.fala||"").slice(0,160);o.notas=String(o.notas||"").slice(0,400);
 o.pos=o.pos&&isFinite(o.pos.x)&&isFinite(o.pos.z)?{x:+o.pos.x,z:+o.pos.z}:null;o.ordem=+o.ordem||0;return o}

/* ---------- pixel sprite: 30 x 82 grid, three-quarter pose taken from the reference photo ---------- */
const SW=30, SH=82, OUT=[27,17,32];
const rgb=h=>[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
const mul=(c,k)=>c.map(v=>Math.max(0,Math.min(255,Math.round(k<1?v*k:v+(255-v)*(k-1)))));
function sprite(c,back){
 const col=new Array(SW*SH).fill(null), part=new Array(SW*SH).fill(null);
 // part = [garment, piece]: seams appear between pieces side by side, and between garments top/bottom
 const put=(x,y,cl,g,p)=>{x+=1;y+=1;if(x<0||y<0||x>=SW||y>=SH)return;const i=y*SW+x;col[i]=cl;part[i]=cl?[g,p||g]:null};
 const rect=(x0,y0,x1,y1,cl,g,p)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)put(x,y,cl,g,p)};
 const row=(y,x0,x1,cl,g,p)=>rect(x0,y,x1,y,cl,g,p);
 const rows=(y0,sp,cl,g,p)=>sp.forEach((s,k)=>row(y0+k,s[0],s[1],cl,g,p));
 const fem=c.corpo==="f", h=c.cabelo, top=c.top;
 const sk=rgb(byId(SKIN,c.pele).c), skD=mul(sk,.82), hc=rgb(c.corCabelo), hcD=mul(hc,.75), hl=mul(hc,1.22), tc=rgb(c.corTop), tcD=mul(tc,.78), bc=rgb(c.corBaixo), bcD=mul(bc,.8), sc=rgb(c.corTenis), hat=rgb(c.corChapeu), hatD=mul(hat,.72);
 const ink=[30,22,30], pink=[255,46,196], white=[240,236,230];
 const longSl=top==="moletom"||top==="jaqueta", eLong=fem?34:28;
 // long hair: the lock on the far side sits behind the body
 if(h==="comprido"&&!back)rect(3,10,4,eLong-6,hcD,"hairB");
 // legs, torso, arms (skin under the clothes)
 rect(7,49,12,68,sk,"leg","legL");rect(15,49,20,71,sk,"leg","legR");
 rect(6,23,21,48,sk,"body");
 put(4,24,sk,"arm","armL");row(25,3,4,sk,"arm","armL");rect(2,26,4,45,sk,"arm","armL");
 put(23,24,sk,"arm","armR");row(25,23,24,sk,"arm","armR");rect(23,26,25,45,sk,"arm","armR");
 // neck and head
 rect(11,20,16,23,skD,"neck");
 const HEAD=[[9,16],[7,18],[6,19],[5,20],[5,20],[4,20],[4,20],[4,20],[4,20],[4,20],[4,20],[4,20],[4,20],[4,20],[5,19],[6,18],[7,17],[9,15]];
 rows(4,HEAD,sk,"head");
 if(!back){
  rect(17,13,18,15,skD,"ear");put(17,14,mul(sk,.65),"ear");
  // face, turned a little to the left
  const lip=mul(sk,.55),blush=[Math.min(255,sk[0]+16),Math.round(sk[1]*.86),Math.round(sk[2]*.9)];
  rect(7,13,7,14,ink,"head");rect(11,13,12,14,ink,"head");
  row(11,6,7,hcD,"head");row(11,10,13,hcD,"head");
  put(8,16,skD,"head");put(9,17,skD,"head");
  put(8,18,lip,"head");row(19,9,11,lip,"head");put(12,18,lip,"head");
  put(14,17,blush,"head");put(15,17,blush,"head");
  if(fem){put(6,12,ink,"head");put(13,12,ink,"head")}
 }
 // bottoms
 if(c.baixo==="saia"){rows(48,[[6,21],[6,21],[6,21],[5,22],[5,22],[5,22],[5,22],[5,22],[4,23],[4,23],[4,23],[4,23],[4,23]],bc,"bottom");for(const x of[7,11,15,19])rect(x,52,x,60,bcD,"bottom");row(48,6,21,bcD,"bottom")}
 else{const sh=c.baixo==="shorts",eL=sh?59:68,eR=sh?60:71;
  rect(6,48,21,52,bc,"bottom","botL");rect(6,53,13,eL,bc,"bottom","botL");rect(14,53,21,eR,bc,"bottom","botR");
  row(eL,6,13,bcD,"bottom","botL");row(eR,14,21,bcD,"bottom","botR");row(48,6,21,bcD,"bottom","botL")}
 // shoes: chunky, toes pointing where the character looks
 const boot=c.tenis==="bota", soleC=boot?mul(sc,.5):[232,226,216];
 const shoe=(x0,x1,yT,yB,toe,pc)=>{rect(x0,yT,x1,yB,sc,"shoe",pc);if(!back)rect(toe,yB-2,x1,yB,sc,"shoe",pc);row(yB+1,back?x0:toe,x1,soleC,"shoe",pc);
  if(boot)row(yT+2,x0,x1,mul(sc,.8),"shoe",pc);else if(!back){row(yB-4,x0+1,x0+3,white,"shoe",pc);rect(toe,yB-1,toe+1,yB,mul(sc,1.3),"shoe",pc)}};
 shoe(6,13,boot?60:66,72,2,"shoeL");shoe(14,21,boot?63:69,75,10,"shoeR");
 // tops: loose fit
 if(top==="regata"){rect(6,26,21,47,tc,"top","torsoT");rect(8,23,9,25,tc,"top","torsoT");rect(18,23,19,25,tc,"top","torsoT");row(47,6,21,tcD,"top","torsoT");if(back)row(26,6,21,tc,"top","torsoT")}
 else{const bot=top==="babytee"?38:48, sl=longSl?45:(top==="babytee"?30:35);
  row(23,7,20,tc,"top","torsoT");rect(5,24,22,bot,tc,"top","torsoT");row(bot,5,22,tcD,"top","torsoT");
  put(4,24,tc,"top","slvL");row(25,3,4,tc,"top","slvL");rect(2,26,4,sl,tc,"top","slvL");row(sl,2,4,tcD,"top","slvL");
  put(23,24,tc,"top","slvR");row(25,23,24,tc,"top","slvR");rect(23,26,25,sl,tc,"top","slvR");row(sl,23,25,tcD,"top","slvR");
  if(back){row(23,9,18,tcD,"top","torsoT");
   if(top==="moletom")rows(21,[[10,17],[9,18],[8,19],[8,19],[8,19],[9,18],[10,17]],tcD,"top","hood");
   if(top==="jaqueta")rect(13,25,13,bot-1,tcD,"top","torsoT")}

function flip(s){const col=[],part=[];for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const j=y*SW+SW-1-x;col.push(s.col[j]);part.push(s.part[j])}return{col,part}}
/* shading + seams + outline on any grid size */
function finish(col,part,SW,SH){
 const out=col.map(v=>v&&v.slice());
 const at=(x,y)=>x>=0&&y>=0&&x<SW&&y<SH?y*SW+x:-1;
 const same=(j,p)=>j>=0&&col[j]&&part[j][1]===p[1];
 for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const i=y*SW+x;if(!col[i])continue;const p=part[i];
  const r=at(x+1,y),d=at(x,y+1),l=at(x-1,y),u=at(x,y-1);
  const flat=p[0]==="glass";
  if(!flat&&r>=0&&col[r]&&part[r][1]!==p[1]){out[i]=mul(col[i],.66);continue}
  if(!flat&&d>=0&&col[d]&&part[d][0]!==p[0]){out[i]=mul(col[i],.7);continue}
  if(flat)continue;
  if(r<0||!col[r]||d<0||!col[d])out[i]=mul(col[i],.76);
  else if(!same(l,p)||u<0||!col[u])out[i]=mul(col[i],1.12);
  else if(same(at(x-2,y),p)&&!same(at(x+2,y),p))out[i]=mul(col[i],.9);
 }
 // outline
 for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const i=y*SW+x;if(col[i])continue;
  for(const [dx,dy] of[[1,0],[-1,0],[0,1],[0,-1]]){const j=at(x+dx,y+dy);if(j>=0&&col[j]){out[i]=OUT;break}}}
 // soft shadow on the ground
 let yb=-1;for(let i=col.length-1;i>=0;i--)if(col[i]){yb=(i/SW)|0;break}
 if(yb>=0)for(let k=0;k<3;k++){const y=yb+k;if(y>=SH)break;const w=SW*(k===1?.4:.32);for(let x=0;x<SW;x++){const i=y*SW+x;if(!out[i]&&Math.abs(x-(SW-1)/2)<=w)out[i]=[0,0,0,70]}}
 return out;
}
/* coarser: merge each 2x2 block into one pixel (most common piece wins) */
function halve(col,part){const W=SW/2,H=SH/2,c2=new Array(W*H).fill(null),p2=new Array(W*H).fill(null);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const cells=[];for(const [dx,dy] of[[0,0],[1,0],[0,1],[1,1]]){const i=(y*2+dy)*SW+x*2+dx;if(col[i])cells.push(i)}
  if(cells.length<2)continue;const cnt={};let best=cells[0],bn=0;for(const i of cells){const k=col[i].join();cnt[k]=(cnt[k]||0)+1;if(cnt[k]>bn){bn=cnt[k];best=i}}
  c2[y*W+x]=col[best];p2[y*W+x]=part[best]}

/* finer: Scale2x doubles the grid and rounds the stair steps while keeping hard pixels */
function scale2x(px,W,H){const out=new Array(W*H*4).fill(null),k=v=>v?v.join():"n",g=(x,y)=>x<0||y<0||x>=W||y>=H?null:px[y*W+x];
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const P=g(x,y),A=g(x,y-1),B=g(x+1,y),C=g(x-1,y),D=g(x,y+1),a=k(A),b=k(B),c=k(C),d=k(D),o=(y*2)*W*2+x*2;
  out[o]=c===a&&c!==d&&a!==b?A:P;out[o+1]=a===b&&a!==c&&b!==d?B:P;out[o+W*2]=d===c&&d!==b&&c!==a?C:P;out[o+W*2+1]=b===d&&b!==a&&d!==c?D:P}
 return out}

function pixels(c,level,view){view=+view||0;let s=sprite(c,view>=2);if(view===1||view===3)s=flip(s);if(level<=1){const h=halve(s.col,s.part);return{px:finish(h.col,h.part,h.W,h.H),W:h.W,H:h.H}}

const pending={}, writing={}, timers={};
function queueSave(id){clearTimeout(timers[id]);pending[id]=true;timers[id]=setTimeout(()=>flush(id),650);setStatus("Salvando…")}
async function flush(id){
 if(!chars[id]){pending[id]=false;return}
 if(mode!=="db"){lsSave();pending[id]=false;setStatus("Salvo neste navegador",true);return}
 if(writing[id]){timers[id]=setTimeout(()=>flush(id),300);return}
 writing[id]=true;
 try{await col.doc(id).set({...chars[id]});setStatus("Salvo na nuvem",true)}catch(e){if(e&&e.code==="invalid_argument")goLocal();else setStatus("Erro ao salvar, tente de novo")}
 writing[id]=false;pending[id]=false;
}
/* a visitor who may not write to the shared cast keeps a personal copy in this browser */
let unsub=null;
function goLocal(){if(unsub){try{unsub()}catch(e){}unsub=null}mode="local";lsSave();try{localStorage.setItem("vbz-atelie-ro","1")}catch(e){}setStatus("Salvo só neste navegador",true)}

  const items=list.filter(([,c])=>c.tipo===tipo);if(!items.length)continue;

 }

/* send / receive: the copied list ends with a code line the owner can paste into "Importar" */
function exportCode(){const arr=sorted().map(([,c])=>{const o={...c};delete o.pos;if(o.local==="atual")o.local="praca";return o});return "VBZ1:"+btoa(unescape(encodeURIComponent(JSON.stringify(arr))))}
function parseCode(txt){const m=/VBZ1:([A-Za-z0-9+/=]+)/.exec(String(txt).replace(/\s+/g,""));if(!m)return null;try{const arr=JSON.parse(decodeURIComponent(escape(atob(m[1]))));return Array.isArray(arr)?arr.slice(0,60).map(clean):null}catch(e){return null}}
function openImport(){
 const f=document.getElementById("form");const old=document.getElementById("importBox");if(old){old.remove();return}
 const box=document.createElement("div");box.className="confirm";box.id="importBox";box.style.flexDirection="column";box.style.alignItems="stretch";
 const t=document.createElement("div");t.textContent="Cole aqui a lista que a pessoa copiou no botão “Copiar lista”. Os personagens dela entram na sua lista, sem apagar os seus.";
 const ta=document.createElement("textarea");ta.className="exportbox";ta.id="f-import";ta.placeholder="Cole a lista inteira, incluindo a linha que começa com VBZ1:";
 const row=document.createElement("div");row.className="actions";
 const ok=document.createElement("button");ok.type="button";ok.className="btn pink";ok.textContent="Adicionar à lista";
 const no=document.createElement("button");no.type="button";no.className="btn";no.textContent="Cancelar";no.onclick=()=>box.remove();
 ok.onclick=()=>{const list=parseCode(ta.value);if(!list||!list.length){toast("Não achei o código VBZ1 nesse texto");return}
  let last=null;list.forEach((c,i)=>{const id=mode==="db"?col.doc().id:"p"+Date.now().toString(36)+i+Math.random().toString(36).slice(2,6);c.ordem=Date.now()+i;c.pos=null;chars[id]=c;queueSave(id);last=id});
  box.remove();select(last);toast(list.length+(list.length===1?" personagem adicionado":" personagens adicionados"))};
 row.append(ok,no);box.append(t,ta,row);f.prepend(box);ta.focus()}
function exportText(){return exportHuman()+"\n\nCódigo para importar no Ateliê (não apague esta linha):\n"+exportCode()}
function exportHuman(){return "Pixelado: "+PX_NAMES[pxLevel]+" (nível "+pxLevel+" de 4)\n\n"+sorted().map(([,c])=>{
 const L=[`${c.nome} (${c.tipo==="npc"?"NPC":"avatar jogável"})`,
  `  corpo ${c.corpo==="f"?"feminino":"masculino"}, pele ${byId(SKIN,c.pele).n.toLowerCase()}`,
  `  cabelo ${byId(HAIR,c.cabelo).n.toLowerCase()} #${c.corCabelo} | chapéu ${byId(HAT,c.chapeu).n.toLowerCase()}${c.chapeu!=="nenhum"?" #"+c.corChapeu:""} | óculos ${byId(GLASSES,c.oculos).n.toLowerCase()}`,
  `  ${byId(TOPS,c.top).n} #${c.corTop} | ${byId(BOTTOMS,c.baixo).n} #${c.corBaixo} | ${byId(SHOES,c.tenis).n} #${c.corTenis}`];
 if(c.tipo==="npc"){L.push(`  papel: ${c.papel||"-"} | local: ${byId(PLACES,c.local).n} | faz: ${byId(DOES,c.faz).n} | ação: ${byId(ACTIONS,c.acao).n}`);if(c.fala)L.push(`  fala: "${c.fala}"`);if(c.notas)L.push(`  notas: ${c.notas}`)}
 return L.join("\n")}).join("\n\n")}
document.getElementById("btnExport").onclick=async()=>{const txt=exportText();
 try{await navigator.clipboard.writeText(txt);toast("Lista copiada. Cole numa mensagem para enviar.")}
 catch(e){const f=document.getElementById("form");const ta=document.createElement("textarea");ta.className="exportbox";ta.id="f-export";ta.readOnly=true;ta.value=txt;f.prepend(ta);ta.focus();ta.select();toast("Selecionei a lista. Copie com Ctrl+C.")}};
document.getElementById("btnNew").onclick=()=>create();
document.getElementById("btnImport").onclick=openImport;
/* pixelation slider: one setting for the whole cast, saved with it so Claude can read it */
const pxRange=document.getElementById("pxRange");let pxTimer=null;
function showPx(){pxRange.value=pxLevel;document.getElementById("pxName").textContent=PX_NAMES[pxLevel]+" · "+(pxLevel<=1?(SW/2)+" × "+(SH/2):SW*2**(pxLevel-2)+" × "+SH*2**(pxLevel-2))+" pixels"}
pxRange.oninput=()=>{pxLevel=Math.max(1,Math.min(4,+pxRange.value||2));showPx();renderPreview();try{localStorage.setItem("vbz-atelie-pixel",pxLevel)}catch(e){}
 clearTimeout(pxTimer);pxTimer=setTimeout(async()=>{if(mode==="db"){try{await db.doc("config/estilo").set({pixel:pxLevel});setStatus("Salvo na nuvem",true)}catch(e){}}},600)};
showPx();
const zmRange=document.getElementById("zmRange");let zoom=3;try{const v=+localStorage.getItem("vbz-atelie-zoom");if(v>=1&&v<=6)zoom=v}catch(e){}
function showZoom(){zmRange.value=zoom;document.getElementById("zmName").textContent=zoom+"× · "+66*zoom+" px de altura";document.getElementById("preview").style.setProperty("--zh",66*zoom+"px")}
document.getElementById("btnTurn").onclick=()=>{view=(view+1)%4;renderPreview()};
zmRange.oninput=()=>{zoom=Math.max(1,Math.min(6,+zmRange.value||3));showZoom();try{localStorage.setItem("vbz-atelie-zoom",zoom)}catch(e){}};
showZoom();

/* ---------- boot ---------- */
function bootLocal(){mode="local";const saved=lsLoad();chars={};for(const k in saved)chars[k]=clean(saved[k]);
 setStatus("Só neste navegador");cur=sorted()[0]?.[0]||null;if(!cur){create();return}select(cur)}
(async()=>{
 let api=null;try{api=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){api=null}
 if(!api){bootLocal();return}
 let ro=false;try{ro=localStorage.getItem("vbz-atelie-ro")==="1"&&Object.keys(lsLoad()).length>0}catch(e){}
 if(ro){bootLocal();setStatus("Salvo só neste navegador",true);return}
 db=api;col=db.collection("personagens");mode="db";
 db.doc("config/estilo").get().then(s=>{const v=s.exists&&+s.data().pixel;if(PX_NAMES[v]&&v!==pxLevel){pxLevel=v;showPx();renderPreview()}}).catch(()=>{});
 let first=true;const timer=setTimeout(()=>{if(first)setStatus("Sem conexão com a nuvem ainda")},10000);
 unsub=col.onSnapshot(snap=>{
  if(mode!=="db")return;
  const next={};for(const d of snap.docs){next[d.id]=pending[d.id]&&chars[d.id]?chars[d.id]:clean(d.data())}
  for(const id in chars)if(pending[id]&&!next[id])next[id]=chars[id];
  chars=next;
  if(!snap.metadata.fromCache){clearTimeout(timer);if(first)setStatus("Salvo na nuvem",true)}
  const wasFirst=first;first=false;
  if(!cur||!chars[cur])cur=sorted()[0]?.[0]||null;
  renderCast();renderPreview();
  const a=document.activeElement;const typing=a&&a.closest&&a.closest("#form")&&/INPUT|TEXTAREA/.test(a.tagName);
  if(wasFirst||!typing)renderForm();
 },err=>{clearTimeout(timer);if(first)bootLocal();else setStatus("Conexão perdida. Mudanças novas ficam só aqui.")});
})();
</script>
